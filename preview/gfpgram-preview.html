<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GFPGRAM: превью дизайна</title>
<style>
:root{--bg:#000;--card:#1c1c1e;--line:#2c2c2e;--text:#fff;--sub:#8e8e93;--acc:#9b7bff;--navbg:rgba(20,20,22,.82);--fld:rgba(255,255,255,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f2f7;--card:#fff;--line:#e5e5ea;--text:#000;--sub:#6e6e73;--acc:#7a5cff;--navbg:rgba(250,250,252,.85);--fld:rgba(0,0,0,.05)}}
:root[data-theme="light"]{--bg:#f2f2f7;--card:#fff;--line:#e5e5ea;--text:#000;--sub:#6e6e73;--acc:#7a5cff;--navbg:rgba(250,250,252,.85);--fld:rgba(0,0,0,.05)}
:root[data-theme="dark"]{--bg:#000;--card:#1c1c1e;--line:#2c2c2e;--text:#fff;--sub:#8e8e93;--acc:#9b7bff;--navbg:rgba(20,20,22,.82);--fld:rgba(255,255,255,.07)}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.35 -apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
svg{display:block}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding:0 0 96px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;padding:12px 16px;background:var(--navbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.nav b{flex:1;text-align:center;font-size:17px;font-weight:600;margin-right:30px}
.nav i{color:var(--acc);width:30px;cursor:pointer}
.hero{position:relative;margin:8px 16px 4px;padding:22px 20px 24px;border-radius:24px;text-align:center;overflow:hidden;background:linear-gradient(135deg,rgba(123,92,255,.34),rgba(255,95,162,.26) 55%,rgba(255,154,68,.22));border:1px solid rgba(176,140,255,.32);animation:shift 6s ease-in-out infinite alternate;background-size:160% 160%}
@keyframes shift{from{background-position:0 0}to{background-position:100% 100%}}
.logo{width:92px;height:92px;margin:0 auto 12px;border-radius:26px;display:grid;place-items:center;font-size:54px;font-weight:800;color:#2b1d00;background:linear-gradient(145deg,#ffe58a,#f9b004 55%,#e07a00);box-shadow:0 12px 30px rgba(249,176,4,.35),inset 0 1px 0 rgba(255,255,255,.6);animation:float 2.4s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(-3px)}to{transform:translateY(3px)}}
.hero h1{margin:0 0 6px;font-size:26px;font-weight:700}.hero p{margin:0;color:var(--sub);font-size:15px}
.hd{margin:22px 32px 7px;font-size:13px;color:var(--sub);letter-spacing:.2px}
.list{margin:0 16px;background:var(--card);border-radius:20px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:11px 16px;position:relative;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;transition:transform .5s cubic-bezier(.34,1.8,.5,1);animation:in .55s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*35ms)}
.row.p,.cr.p{transform:scale(.97);transition-duration:.15s}
.row+.row::before{content:"";position:absolute;left:60px;right:0;top:0;height:1px;background:var(--line)}
@keyframes in{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.tile{flex:none;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.tx{flex:1;min-width:0}.tx b{display:block;font-weight:500}.tx span{display:block;color:var(--sub);font-size:13.5px;margin-top:1px}
.val{color:var(--sub);font-size:15px}.chev{color:var(--sub);opacity:.6;display:flex}
.foot{margin:8px 32px 0;color:var(--sub);font-size:13px}
.tog{width:51px;height:31px;border-radius:16px;background:#39393d;position:relative;flex:none;transition:background .25s}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .45s cubic-bezier(.34,1.6,.5,1)}
.tog.on{background:linear-gradient(90deg,#7a5cff,#ff5fa2)}.tog.on::after{transform:translateX(20px)}
.prof{margin:8px 16px 0;background:var(--card);border-radius:20px;overflow:hidden}
.top{padding:26px 16px 18px;text-align:center;background:linear-gradient(160deg,#3b4a63,#22262f)}
.ava{width:84px;height:84px;border-radius:50%;margin:0 auto 10px}
.nm{font-size:21px;font-weight:600;color:#fff;display:flex;justify-content:center;align-items:center;gap:6px}.st{color:#d6dcec;font-size:14px;margin-top:2px}
.pr{padding:12px 16px;border-top:1px solid var(--line)}.pr small{display:block;color:var(--sub);font-size:13px}.pr .l{color:#4c8dff}
.badges{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.bd{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 9px;border-radius:999px;font-size:14px;font-weight:600;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
.b1{background:linear-gradient(135deg,#7a5cff,#4c8dff)}.b2{background:linear-gradient(135deg,#34c759,#2dc7c0)}.b3{background:linear-gradient(135deg,#ff5fa2,#ff9a44)}
.tabs{position:fixed;left:0;right:0;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;z-index:9}
.tabs div{pointer-events:auto;display:flex;gap:2px;padding:5px;border-radius:26px;background:var(--navbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 8px 28px rgba(0,0,0,.35)}
.tabs button{border:0;background:none;color:var(--sub);font:600 10.5px inherit;font-family:inherit;padding:7px 13px 6px;border-radius:21px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;transition:transform .4s cubic-bezier(.34,1.8,.5,1)}
.tabs button:active{transform:scale(.9)}
.tabs button.on{color:#fff;background:linear-gradient(135deg,#7a5cff,#ff5fa2)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translate(-50%,-30px);opacity:0;padding:11px 18px;border-radius:16px;background:linear-gradient(135deg,#7a5cff,#ff5fa2);color:#fff;font-weight:600;font-size:14.5px;z-index:60;transition:all .5s cubic-bezier(.34,1.6,.5,1);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.srch{margin:6px 16px 4px;padding:10px 14px;border-radius:14px;background:var(--card);color:var(--sub);font-size:15px;display:flex;gap:8px;align-items:center}
.stor{display:flex;gap:14px;padding:12px 16px 6px;overflow-x:auto;scrollbar-width:none}.stor::-webkit-scrollbar{display:none}
.st1{flex:none;text-align:center;font-size:12px;color:var(--sub);width:62px}
.ring{width:62px;height:62px;border-radius:50%;padding:3px;background:linear-gradient(135deg,#7a5cff,#ff5fa2,#ff9a44);margin-bottom:4px;box-sizing:border-box}
.ring .av{border:3px solid var(--bg)}
.av{width:100%;height:100%;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:18px;box-sizing:border-box}
.cr{display:flex;gap:12px;align-items:center;padding:10px 16px;position:relative;cursor:pointer;user-select:none;-webkit-tap-highlight-color:transparent;transition:transform .5s cubic-bezier(.34,1.8,.5,1);animation:in .55s cubic-bezier(.2,.9,.3,1.2) both;animation-delay:calc(var(--i)*45ms)}
.cr .a{flex:none;width:54px;height:54px;position:relative}
.dot{position:absolute;right:0;bottom:0;width:14px;height:14px;border-radius:50%;background:#34c759;border:3px solid var(--bg)}
.cm{flex:1;min-width:0}.cm b{display:flex;justify-content:space-between;font-weight:600;gap:6px}.cm b em{font-style:normal;display:flex;gap:5px;align-items:center}.cm b small{color:var(--sub);font-weight:400;font-size:13px}
.cm span{display:flex;justify-content:space-between;gap:8px;color:var(--sub);font-size:15px;margin-top:2px}
.cm span i{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bg{flex:none;min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:linear-gradient(135deg,#7a5cff,#ff5fa2);color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;box-sizing:border-box;font-style:normal}.bg.m{background:#48484a}
.ch{display:flex;flex-direction:column;gap:8px;padding:14px 14px 150px;min-height:70vh;background:radial-gradient(120% 60% at 20% 0,rgba(122,92,255,.22),transparent 60%),radial-gradient(100% 50% at 100% 100%,rgba(255,95,162,.16),transparent 60%)}
.m1{max-width:78%;padding:9px 14px;border-radius:20px;font-size:16px;animation:in .5s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i)*90ms)}
.m1 s{display:block;opacity:.6;font-size:11.5px;text-align:right;margin-top:2px;text-decoration:none}
.in1{align-self:flex-start;background:var(--card);border-bottom-left-radius:6px}
.out{align-self:flex-end;color:#fff;background:linear-gradient(135deg,#7a5cff,#ff5fa2);border-bottom-right-radius:6px;box-shadow:0 6px 18px rgba(122,92,255,.28)}
.del{border:1px dashed rgba(255,95,162,.55)}.del u{display:flex;gap:6px;align-items:center;text-decoration:none;color:#ff7fb6}
.inp{position:fixed;left:50%;transform:translateX(-50%);width:min(398px,calc(100% - 32px));bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;align-items:center;z-index:8}
.inp div{flex:1;padding:11px 16px;border-radius:24px;background:var(--navbg);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:var(--sub);box-shadow:0 6px 20px rgba(0,0,0,.25)}
.inp button{width:44px;height:44px;border-radius:50%;border:0;color:#fff;display:grid;place-items:center;background:linear-gradient(135deg,#7a5cff,#ff5fa2);box-shadow:0 6px 18px rgba(122,92,255,.4);transition:transform .4s cubic-bezier(.34,1.8,.5,1)}.inp button:active{transform:scale(.88)}
.ltr{margin:14px 32px 6px;font-size:13px;font-weight:600;color:var(--acc)}
/* вход и регистрация */
#auth{position:fixed;inset:0;z-index:40;background:var(--bg);overflow:auto;transition:opacity .4s,transform .5s cubic-bezier(.3,.9,.3,1)}
#auth.hidden{opacity:0;transform:scale(1.04);pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(64px);opacity:.5;animation:drift 11s ease-in-out infinite alternate;pointer-events:none}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(34px,46px) scale(1.15)}}
.as{position:relative;max-width:430px;margin:0 auto;min-height:100%;box-sizing:border-box;padding:calc(18px + env(safe-area-inset-top,0px)) 22px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.as>*{animation:in .6s cubic-bezier(.2,.9,.3,1.2) both}.as>:nth-child(2){animation-delay:.05s}.as>:nth-child(3){animation-delay:.1s}.as>:nth-child(4){animation-delay:.15s}.as>:nth-child(5){animation-delay:.2s}.as>:nth-child(6){animation-delay:.25s}
.top2{display:flex;align-items:center;gap:12px;height:40px}
.back{width:38px;height:38px;border-radius:50%;background:var(--fld);display:grid;place-items:center;cursor:pointer;flex:none;color:var(--text)}
.bars{flex:1;display:flex;gap:6px}.bars i{flex:1;height:4px;border-radius:2px;background:var(--fld)}.bars i.on{background:linear-gradient(90deg,#7a5cff,#ff5fa2)}
.at{margin:26px 0 8px;font-size:30px;font-weight:700;letter-spacing:-.3px}.as2{color:var(--sub);font-size:15.5px;margin:0 0 22px;max-width:34ch}
.fld{display:flex;align-items:center;gap:10px;padding:0 16px;height:58px;border-radius:18px;background:var(--fld);border:1.5px solid transparent;margin-bottom:12px;transition:border-color .25s,box-shadow .25s}
.fld:focus-within{border-color:#8f7bff;box-shadow:0 0 0 4px rgba(143,123,255,.18)}
.fld input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:18px;letter-spacing:.2px}.fld svg{color:var(--sub);flex:none}
.cc{padding-right:12px;border-right:1px solid var(--line);font-weight:600;white-space:nowrap}
.cta{margin-top:auto;border:0;height:56px;border-radius:18px;color:#fff;font:700 17px inherit;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#7a5cff,#ff5fa2 60%,#ff9a44);box-shadow:0 10px 26px rgba(122,92,255,.4);transition:transform .45s cubic-bezier(.34,1.8,.5,1),opacity .25s,filter .25s;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.cta:active{transform:scale(.96)}.cta[disabled]{opacity:.4;filter:saturate(.4);box-shadow:none}
.ghost{margin-top:10px;height:50px;border-radius:18px;border:1.5px solid var(--line);background:var(--fld);color:var(--text);font:600 16px inherit;font-family:inherit;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:transform .45s cubic-bezier(.34,1.8,.5,1)}.ghost:active{transform:scale(.97)}
.lnk{margin:16px auto 0;color:var(--acc);font-size:14.5px;cursor:pointer;background:none;border:0;font-family:inherit}
.chip{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:var(--fld);color:var(--sub);font-size:13px;align-self:flex-start;margin-bottom:14px}.chip svg{color:#4c8dff}
.wl{margin:auto 0 18px;text-align:center}.wl .logo{width:118px;height:118px;border-radius:34px;font-size:70px;margin-bottom:18px}
.wl h1{margin:0 0 8px;font-size:36px;letter-spacing:-.5px}.wl p{margin:0 auto;color:var(--sub);max-width:30ch}
.pts{margin:6px 0 20px;display:flex;flex-direction:column;gap:12px}.pts div{display:flex;gap:12px;align-items:center;font-size:14.5px;color:var(--sub);text-align:left}.pts .tile{width:36px;height:36px}
.otp{position:relative;display:flex;gap:10px;margin-bottom:14px}.otp b{flex:1;height:64px;border-radius:18px;background:var(--fld);border:1.5px solid transparent;display:grid;place-items:center;font-size:28px;font-weight:700;transition:border-color .2s,transform .35s cubic-bezier(.34,1.8,.5,1)}
.otp b.cur{border-color:#8f7bff;box-shadow:0 0 0 4px rgba(143,123,255,.18)}.otp b.f{transform:scale(1.05);border-color:rgba(255,95,162,.6)}
.otp input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}
.qrw{align-self:center;padding:16px;border-radius:28px;background:#fff;box-shadow:0 14px 40px rgba(122,92,255,.4);position:relative;margin:4px 0 22px}
.qrw .c{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:32px;color:#2b1d00;background:linear-gradient(145deg,#ffe58a,#f9b004 55%,#e07a00);border:4px solid #fff;box-sizing:border-box}
.stp{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}.stp div{display:flex;gap:12px;align-items:center;color:var(--sub);font-size:14.5px}.stp i{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:13px;color:#fff;background:linear-gradient(135deg,#7a5cff,#ff5fa2)}
.pick{width:112px;height:112px;border-radius:50%;margin:6px auto 22px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#7a5cff,#ff5fa2 60%,#ff9a44);box-shadow:0 12px 32px rgba(122,92,255,.4);cursor:pointer;position:relative;font-size:38px;font-weight:700;transition:transform .45s cubic-bezier(.34,1.8,.5,1)}.pick:active{transform:scale(.93)}
.pick u{position:absolute;right:0;bottom:2px;width:34px;height:34px;border-radius:50%;background:var(--bg);display:grid;place-items:center;text-decoration:none;color:var(--text)}
.tm{color:var(--sub);font-size:12.5px;text-align:center;margin-top:12px}
#bgl{position:fixed;inset:0;z-index:-1;overflow:hidden;display:none}#bgl b{position:absolute;inset:-30px;background-size:cover;background-position:center;transition:filter .5s}#bgl i{position:absolute;inset:0;background:#000;transition:opacity .5s}
body.hasbg{background:transparent;--card:rgba(28,28,30,.55);--line:rgba(255,255,255,.12)}body.hasbg .list,body.hasbg .prof,body.hasbg .srch,body.hasbg .in1{backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}body.hasbg #bgl{display:block}
html.hasbg{background:#000}

#call,#sheetw{position:fixed;inset:0;z-index:50;opacity:0;pointer-events:none;transition:opacity .45s}
#call.on,#sheetw.on{opacity:1;pointer-events:auto}
#call{background:radial-gradient(120% 70% at 20% 0,#7a5cff,transparent 60%),radial-gradient(110% 60% at 100% 100%,#ff5fa2,transparent 60%),linear-gradient(180deg,#14102e,#1d0f2a);color:#fff;display:flex;flex-direction:column;align-items:center;padding:calc(70px + env(safe-area-inset-top,0px)) 24px calc(46px + env(safe-area-inset-bottom,0px));box-sizing:border-box;overflow:hidden}
#call::before{content:"";position:absolute;inset:-20%;background:conic-gradient(from 0deg,rgba(122,92,255,.25),rgba(255,95,162,.25),rgba(255,154,68,.2),rgba(122,92,255,.25));filter:blur(70px);animation:spin 18s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#call>*{position:relative}
.cav{position:relative;width:132px;height:132px;margin:26px 0 22px}.cav .av{font-size:44px;box-shadow:0 14px 40px rgba(0,0,0,.4)}
.cav s{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.45);animation:ring 2.6s ease-out infinite}.cav s:nth-child(2){animation-delay:.85s}.cav s:nth-child(3){animation-delay:1.7s}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(2.1);opacity:0}}
#call h2{margin:0;font-size:30px;font-weight:700}#call p{margin:6px 0 0;color:rgba(255,255,255,.75);font-size:16px}
.cbtns{margin-top:auto;display:flex;gap:46px;align-items:flex-end}.cb{display:flex;flex-direction:column;align-items:center;gap:9px;font-size:13px;color:rgba(255,255,255,.85)}
.cb b{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;color:#fff;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .45s cubic-bezier(.34,1.8,.5,1)}.cb b:active{transform:scale(.88)}
.red{background:linear-gradient(135deg,#ff5e62,#ff2d55)}.grn{background:linear-gradient(135deg,#34c759,#2dc7c0);animation:pulse 1.6s ease-in-out infinite}.glass{background:rgba(255,255,255,.16);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}.glass.on{background:#fff;color:#1d0f2a}
@keyframes pulse{50%{transform:scale(1.08);box-shadow:0 0 0 14px rgba(52,199,89,.18)}}
#sheetw{background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(430px,100%);background:var(--card);border-radius:30px 30px 0 0;padding:10px 14px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .55s cubic-bezier(.2,.9,.3,1.1)}
#sheetw.on .sheet{transform:none}.sheet i{display:block;width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
.sheet h3{margin:4px 8px 10px;font-size:17px}.sheet .list{margin:0;background:var(--fld)}
.alert{position:fixed;left:50%;top:50%;width:min(300px,84vw);transform:translate(-50%,-50%) scale(.85);opacity:0;pointer-events:none;background:var(--card);border-radius:26px;padding:22px 20px 16px;text-align:center;z-index:55;box-shadow:0 20px 60px rgba(0,0,0,.5),0 0 0 1px rgba(176,140,255,.25);transition:all .5s cubic-bezier(.34,1.5,.5,1)}
.alert.on{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}.alert h4{margin:10px 0 6px;font-size:18px}.alert p{margin:0 0 16px;color:var(--sub);font-size:14.5px}
.alert .ab{display:flex;gap:10px}.alert .ab button{flex:1;height:46px;border-radius:15px;border:0;font:600 15px inherit;font-family:inherit;color:var(--text);background:var(--fld);cursor:pointer}.alert .ab .pri{color:#fff;background:linear-gradient(135deg,#7a5cff,#ff5fa2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app"><div class="nav"><i id="back"></i><b id="ttl">GFPGRAM</b></div><div id="view"></div></div>
<div id="bgl"><b></b><i></i></div><input type="file" id="bgf" accept="image/*" hidden>
<div id="call"></div><div id="sheetw"><div class="sheet" id="sheet"></div></div><div class="alert" id="alert"></div>
<div class="toast" id="toast"></div>
