name: Build AyuiOS ipa

on:
  workflow_dispatch:
    inputs:
      telegram_repo:
        description: "Репозиторий основы: TelegramMessenger/Telegram-iOS или Swiftgram/Telegram-iOS"
        default: "TelegramMessenger/Telegram-iOS"
      telegram_ref:
        description: "Ветка/тег Telegram-iOS"
        default: "master"
      disable:
        description: "Патчи для отключения (через запятую): ghost-read,ghost-typing,ghost-online,ghost-stories,keep-deleted,edit-history,hide-ads,allow-copy,ghost-screenshot,ghost-consume,keep-cleared,profile-info,branding-name,branding-icon,owner-hash"
        default: "profile-info"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Clone Telegram-iOS
        run: |
          set -x
          export GIT_TERMINAL_PROMPT=0
          git config --global http.postBuffer 524288000
          git config --global http.version HTTP/1.1
          REPO="${{ inputs.telegram_repo }}"
          REF="${{ inputs.telegram_ref }}"
          for i in 1 2 3; do
            rm -rf telegram
            if git clone --depth 1 --branch "$REF" "https://github.com/$REPO.git" telegram; then break; fi
            echo "clone попытка $i не удалась"; sleep 10
          done
          [ -d telegram/.git ] || { echo "::error::Не удалось клонировать $REPO@$REF (проверь имя репозитория и ветку)"; exit 1; }
          cd telegram
          for i in 1 2 3; do
            if git submodule update --init --recursive --jobs 4; then OK=1; break; fi
            echo "submodules попытка $i не удалась"; sleep 15
          done
          [ "$OK" = 1 ] || { echo "::error::Не скачались подмодули (см. лог выше)"; git submodule status || true; exit 1; }
          cat versions.json || true

      - name: Select Xcode
        run: |
          sw_vers
          XC=$(jq -r .xcode telegram/versions.json)
          echo "Нужен Xcode $XC"
          ls /Applications | grep -i xcode || true
          FOUND=""
          for P in "/Applications/Xcode_${XC}.app" "/Applications/Xcode_${XC}.0.app"; do
            if [ -d "$P" ]; then FOUND="$P"; break; fi
          done
          if [ -z "$FOUND" ]; then
            FOUND=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            VER=$(defaults read "$FOUND/Contents/Info" CFBundleShortVersionString)
            echo "::warning::Xcode $XC не найден, беру $VER ($FOUND)"
            jq --arg v "$VER" '.xcode=$v' telegram/versions.json > /tmp/v.json && cp /tmp/v.json telegram/versions.json
          fi
          sudo xcode-select -s "$FOUND"
          echo "xcode-select: $(xcode-select -p)"
          xcodebuild -version

      - name: Install Pillow
        run: pip3 install pillow --break-system-packages || pip3 install pillow

      - name: Apply Ayu patches
        run: python3 patches/apply_patches.py telegram "${{ inputs.disable }}" | tee patch-report.txt

      - name: Configure (api_id / api_hash / bundle_id / team_id)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cd telegram
          python3 - << 'PY'
          import json, os, plistlib, subprocess
          cfg = json.load(open('build-system/template_minimal_development_configuration.json'))
          team, bundle = 'GFPGRAM123', 'org.gfpgram.Telegram'
          try:
              r = subprocess.run(['openssl', 'smime', '-inform', 'der', '-verify', '-noverify', '-in',
                                  'build-system/fake-codesigning/profiles/Telegram.mobileprovision'],
                                 capture_output=True, check=True)
              appid = plistlib.loads(r.stdout)['Entitlements']['application-identifier']
              t, b = appid.split('.', 1)
              print('profile application-identifier:', appid)
              if len(t) == 10 and b and '*' not in b:
                  team, bundle = t, b
          except Exception as e:
              print('profile parse failed, using defaults:', e)
          api_id = os.environ.get('API_ID', '').strip()
          api_hash = os.environ.get('API_HASH', '').strip()
          if not api_id.isdigit() or len(api_hash) != 32:
              raise SystemExit('ОШИБКА: секреты API_ID (число) и API_HASH (32 символа) пустые или не созданы. '
                               'Settings -> Secrets and variables -> Actions -> Secrets -> New repository secret.')
          cfg['api_id'] = api_id
          cfg['api_hash'] = api_hash
          cfg['bundle_id'] = bundle
          cfg['team_id'] = team
          for k, v in cfg.items():
              if isinstance(v, str) and '{!' in v:
                  print('WARN: placeholder left in', k, '=', v)
          json.dump(cfg, open('../config.json', 'w'), indent=2)
          print({k: v for k, v in cfg.items() if k != 'api_hash'})
          PY

      - name: Fix codesigning (profiles + signing identity)
        run: |
          cd telegram
          cat > /tmp/openssl.cnf << 'CNF'
          [req]
          distinguished_name = dn
          x509_extensions = v3
          prompt = no
          [dn]
          CN = GFPGRAM Fake Signing
          [v3]
          basicConstraints = critical,CA:false
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          CNF
          # сертификат A: им подписывается приложение (identity в keychain)
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/k.pem -out /tmp/c.pem -days 3650 -config /tmp/openssl.cnf
          /usr/bin/openssl x509 -in /tmp/c.pem -outform der -out /tmp/c.der
          # сертификат B: только для обёртки профилей (CMS)
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -keyout /tmp/k2.pem -out /tmp/c2.pem -days 3650 -subj "/CN=profile-signer"
          python3 - << 'PY'
          import glob, os, re, subprocess, plistlib
          ind = lambda l: len(l) - len(l.lstrip(' \t'))
          der = open('/tmp/c.der', 'rb').read()

          # 1. профили: aps-environment + наш сертификат в DeveloperCertificates
          for f in sorted(glob.glob('build-system/fake-codesigning/profiles/*')):
              name = os.path.basename(f)
              r = subprocess.run(['/usr/bin/openssl', 'smime', '-inform', 'der', '-verify', '-noverify', '-in', f], capture_output=True)
              if r.returncode != 0:
                  print('profile', name, 'READ_FAIL', r.stderr[:200]); continue
              pl = plistlib.loads(r.stdout)
              pl.setdefault('Entitlements', {}).setdefault('aps-environment', 'development')
              pl['DeveloperCertificates'] = [der]
              open('/tmp/p.plist', 'wb').write(plistlib.dumps(pl))
              w = subprocess.run(['/usr/bin/openssl', 'smime', '-sign', '-signer', '/tmp/c2.pem', '-inkey', '/tmp/k2.pem',
                                  '-binary', '-nodetach', '-outform', 'der', '-in', '/tmp/p.plist'], capture_output=True)
              if w.returncode != 0:
                  print('profile', name, 'SIGN_FAIL', w.stderr[:200]); continue
              open(f, 'wb').write(w.stdout)
              chk = subprocess.run(['/usr/bin/openssl', 'smime', '-inform', 'der', '-verify', '-noverify', '-in', f], capture_output=True)
              print('profile', name, 'patched' if chk.returncode == 0 else 'BROKEN')

          # 2. обезвреживаем проверку в Make-скриптах
          MSG = 'Could not find a valid aps-environment'
          done = 0
          for path in glob.glob('build-system/**/*.py', recursive=True):
              lines = open(path, encoding='utf-8').read().split('\n')
              hit = [i for i, l in enumerate(lines) if MSG in l]
              if not hit:
                  continue
              i = hit[0]
              print('--- found check in', path, 'line', i + 1)
              print('\n'.join(lines[max(0, i - 12):i + 4]))
              j = i
              while j >= 0 and not (lines[j].strip().startswith(('if ', 'elif ')) and ind(lines[j]) < ind(lines[i])):
                  j -= 1
              if j < 0:
                  print('guard not found'); continue
              k = j + 1
              while k < len(lines) and (not lines[k].strip() or ind(lines[k]) > ind(lines[j])):
                  k += 1
              pad = ' ' * ind(lines[j])
              m = re.match(r'\s*(?:if|elif)\s+(?:not\s+(\w+)|(\w+)\s+is\s+None)\s*:', lines[j])
              var = m and (m.group(1) or m.group(2))
              if var and lines[j].strip().startswith('if '):
                  repl = [lines[j], pad + '    ' + var + ' = "development"']
              else:
                  repl = [pad + lines[j].strip().split()[0] + ' False:', pad + '    pass']
              lines[j:k] = repl
              open(path, 'w', encoding='utf-8').write('\n'.join(lines))
              print('PATCHED guard ->', repl)
              done += 1
          print('make-check patched:', done)
          PY
          # identity в keychain
          /usr/bin/openssl pkcs12 -export -inkey /tmp/k.pem -in /tmp/c.pem -out /tmp/id.p12 -passout pass:gfp
          security create-keychain -p gfp build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p gfp build.keychain
          security import /tmp/id.p12 -k build.keychain -P gfp -T /usr/bin/codesign -T /usr/bin/security -A
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k gfp build.keychain
          security list-keychains -d user -s build.keychain $(security list-keychains -d user | tr -d '"')
          security default-keychain -s build.keychain
          sudo security add-trusted-cert -d -r trustRoot -k /Library/Keychains/System.keychain /tmp/c.pem || true
          echo "--- identities (valid):"
          security find-identity -v -p codesigning
          echo "--- identities (all):"
          security find-identity -p codesigning

      - name: Restore Bazel cache
        uses: actions/cache/restore@v4
        with:
          path: ~/bazel-cache
          key: bazel-${{ github.run_id }}
          restore-keys: bazel-

      - name: Build
        run: |
          cd telegram
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/bazel-cache" \
            build \
            --configurationPath=../config.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=100001 \
            --configuration=release_arm64

      - name: Save Bazel cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/bazel-cache
          key: bazel-${{ github.run_id }}

      - name: Collect ipa
        if: always()
        run: |
          # bazel-bin — симлинк; без -L find не заходит внутрь и ничего не находит
          IPA=$(find -L telegram/bazel-bin -name "Telegram.ipa" -type f 2>/dev/null | head -1)
          if [ -z "$IPA" ]; then
            echo "в bazel-bin не найдено, ищу в кэше bazel"
            IPA=$(find -L "$HOME/bazel-cache" -name "Telegram.ipa" -type f 2>/dev/null | head -1)
          fi
          echo "ipa: $IPA"
          if [ -n "$IPA" ]; then
            cp "$IPA" AyuiOS.ipa
            ls -la AyuiOS.ipa
          else
            echo "::error::Telegram.ipa не найден — смотри лог шага Build"
            find -L telegram/bazel-bin -maxdepth 3 2>/dev/null | head -50 || true
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: warn
          name: AyuiOS
          path: |
            AyuiOS.ipa
            patch-report.txt

