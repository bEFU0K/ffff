name: Build AyuiOS ipa

on:
  workflow_dispatch:
    inputs:
      telegram_repo:
        description: "Репозиторий основы: TelegramMessenger/Telegram-iOS или Swiftgram/Telegram-iOS"
        default: "TelegramMessenger/Telegram-iOS"
      telegram_ref:
        description: "Ветка/тег Telegram-iOS"
        default: "master"
      disable:
        description: "Патчи для отключения (через запятую): ghost-read,ghost-typing,ghost-online,ghost-stories,keep-deleted,edit-history,hide-ads,allow-copy,ghost-screenshot,ghost-consume,keep-cleared,profile-info,branding-name,branding-icon,owner-hash"
        default: "profile-info"

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Clone Telegram-iOS
        run: |
          git clone --depth 1 --branch "${{ inputs.telegram_ref }}" --recursive \
            https://github.com/${{ inputs.telegram_repo }}.git telegram
          cat telegram/versions.json || true

      - name: Select Xcode
        run: |
          sw_vers
          XC=$(jq -r .xcode telegram/versions.json)
          echo "Нужен Xcode $XC"
          ls /Applications | grep -i xcode || true
          FOUND=""
          for P in "/Applications/Xcode_${XC}.app" "/Applications/Xcode_${XC}.0.app"; do
            if [ -d "$P" ]; then FOUND="$P"; break; fi
          done
          if [ -z "$FOUND" ]; then
            FOUND=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
            VER=$(defaults read "$FOUND/Contents/Info" CFBundleShortVersionString)
            echo "::warning::Xcode $XC не найден, беру $VER ($FOUND)"
            jq --arg v "$VER" '.xcode=$v' telegram/versions.json > /tmp/v.json && cp /tmp/v.json telegram/versions.json
          fi
          sudo xcode-select -s "$FOUND"
          echo "xcode-select: $(xcode-select -p)"
          xcodebuild -version

      - name: Install Pillow
        run: pip3 install pillow --break-system-packages || pip3 install pillow

      - name: Apply Ayu patches
        run: python3 patches/apply_patches.py telegram "${{ inputs.disable }}" | tee patch-report.txt

      - name: Configure (api_id / api_hash)
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
        run: |
          cd telegram
          jq --arg id "$API_ID" --arg hash "$API_HASH" \
            '.api_id=$id | .api_hash=$hash' \
            build-system/template_minimal_development_configuration.json > ../config.json
          jq 'del(.api_hash)' ../config.json
          ls build-system/fake-codesigning/profiles || true

      - name: Fix codesigning (aps-environment)
        run: |
          cd telegram
          ls build-system/fake-codesigning/profiles || true
          python3 - << 'PY'
          import glob, os, re
          ind = lambda l: len(l) - len(l.lstrip(' \t'))

          # 1. дописываем aps-environment во все поддельные профили
          for f in glob.glob('build-system/fake-codesigning/profiles/*'):
              data = open(f, 'rb').read()
              had = b'aps-environment' in data
              new, n = re.subn(rb'(<key>Entitlements</key>\s*<dict>)', rb'\1<key>aps-environment</key><string>development</string>', data, count=1) if not had else (data, 0)
              if n:
                  open(f, 'wb').write(new)
              print('profile', os.path.basename(f), 'had_aps' if had else ('patched' if n else 'NOT_PATCHED'))

          # 2. обезвреживаем проверку в Make-скриптах
          MSG = 'Could not find a valid aps-environment'
          done = 0
          for path in glob.glob('build-system/**/*.py', recursive=True):
              lines = open(path, encoding='utf-8').read().split('\n')
              hit = [i for i, l in enumerate(lines) if MSG in l]
              if not hit:
                  continue
              i = hit[0]
              print('--- found check in', path, 'line', i + 1)
              print('\n'.join(lines[max(0, i - 12):i + 4]))
              j = i
              while j >= 0 and not (lines[j].strip().startswith(('if ', 'elif ')) and ind(lines[j]) < ind(lines[i])):
                  j -= 1
              if j < 0:
                  print('guard not found'); continue
              k = j + 1
              while k < len(lines) and (not lines[k].strip() or ind(lines[k]) > ind(lines[j])):
                  k += 1
              pad = ' ' * ind(lines[j])
              m = re.match(r'\s*(?:if|elif)\s+(?:not\s+(\w+)|(\w+)\s+is\s+None)\s*:', lines[j])
              var = m and (m.group(1) or m.group(2))
              if var and lines[j].strip().startswith('if '):
                  repl = [lines[j], pad + '    ' + var + ' = "development"']
              else:
                  repl = [pad + lines[j].strip().split()[0] + ' False:', pad + '    pass']
              lines[j:k] = repl
              open(path, 'w', encoding='utf-8').write('\n'.join(lines))
              print('PATCHED guard ->', repl)
              done += 1
          print('make-check patched:', done)
          PY

      - name: Build
        run: |
          cd telegram
          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/bazel-cache" \
            build \
            --configurationPath=../config.json \
            --codesigningInformationPath=build-system/fake-codesigning \
            --buildNumber=100001 \
            --configuration=release_arm64

      - name: Collect ipa
        run: cp telegram/bazel-bin/Telegram/Telegram.ipa AyuiOS.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AyuiOS
          path: |
            AyuiOS.ipa
            patch-report.txt

            AyuiOS.ipa
            patch-report.txt
